<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Space | Ultimate Basic Quiz</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script>
        // Session Check
        if (localStorage.getItem("sudahLogin") !== "true") {
            window.location.href = "login.html";
        }
    </script>
    <style>
        /* Quiz Specific Styles */
        .container {
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
        }
        .quiz-option {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: 2px solid #edf2f7;
            border-radius: 12px;
            background: #f8fafc;
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .quiz-option:hover:not([disabled]) {
            border-color: #4a90e2;
            background: #f0f7ff;
        }
        .quiz-option.correct {
            background: #dcfce7 !important;
            border-color: #22c55e !important;
            color: #166534;
        }
        .quiz-option.wrong {
            background: #fee2e2 !important;
            border-color: #ef4444 !important;
            color: #991b1b;
        }
        .btn-main {
            padding: 12px 25px;
            border-radius: 50px;
            border: none;
            background: #4a90e2;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-main:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(74, 144, 226, 0.3);
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html" class="logo">EnglishSpace</a>
        <button class="hamburger" onclick="toggleMenu()">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="lessons.html">Materials</a>
            <a href="dashboard.html" class="active">Quiz</a>
            <a href="about.html">About</a>
            <a href="profile.html">Profile(<span id="nav-user">Guest</span>)</a>
            <a href="#" onclick="logout()" style="color: #e74c3c; font-weight: bold;">Log Out</a>
        </div>
    </nav>

    <div class="container">
        <div id="quiz-box" class="card">
            <div id="quiz-content">
                <h2 style="color: #4a90e2; margin-bottom: 5px;">English Basics Proficiency 🏆</h2>
                <p id="progress" style="color: gray; font-weight: bold; margin-bottom: 20px;">Question 1 of 30</p>
                <hr style="border: 0; border-top: 1px solid #eee; margin-bottom: 25px;">
                <h3 id="question-text" style="margin-bottom: 25px;">Loading question...</h3>
                <div id="options-container"></div>
                <button id="next-btn" class="btn-main" style="display:none; margin-top: 25px; width: 100%;" onclick="handleNext()">Next Question ➔</button>
            </div>

            <div id="result-content" style="display: none;">
                <h1 id="rank-emoji" style="font-size: 5rem; margin-bottom: 10px;">🏅</h1>
                <h2 id="rank-title" style="font-size: 2rem; color: #4a90e2;">Calculating...</h2>
                <p id="final-score" style="font-size: 1.5rem; font-weight: bold; margin: 15px 0;"></p>
                <p id="rank-desc" style="color: #666; line-height: 1.6; margin-bottom: 30px;"></p>
                
                <div style="display: flex; gap: 15px; justify-content: center;">
                    <button class="btn-main" onclick="location.reload()" style="background: #95a5a6;">Restart Quiz</button>
                    <a href="dashboard.html" class="btn-main" style="background: #67b26f; text-decoration: none; line-height: 2.5;">Dashboard</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const questions = [
            // Dasar & Grammar Awal
            { q: "Which is a common greeting?", a: ["Goodbye", "Hello", "Apple"], c: 1 },
            { q: "I ___ a student at EnglishEdge.", a: ["is", "am", "are"], c: 1 },
            { q: "What is the plural form of 'Box'?", a: ["Boxs", "Boxies", "Boxes"], c: 2 },
            { q: "Which of these is a fruit?", a: ["Blue", "Orange", "Pink"], c: 1 },
            { q: "Choose the correct spelling:", a: ["Apple", "Apel", "Appel"], c: 0 },
            { q: "They ___ playing football in the park.", a: ["is", "am", "are"], c: 2 },
            { q: "What is the opposite of 'Big'?", a: ["Small", "Large", "Tall"], c: 0 },
            { q: "Which word is a verb (action)?", a: ["Happy", "Run", "Green"], c: 1 },
            { q: "___ name is Sarah. She is my friend.", a: ["She", "Her", "Hers"], c: 1 },
            { q: "Letters like A, E, I, O, U are...", a: ["Consonants", "Vowels", "Nouns"], c: 1 },
            // Menengah
            { q: "She ___ to school by bus every day.", a: ["go", "goes", "going"], c: 1 },
            { q: "I ___ finished my homework yet.", a: ["haven't", "hasn't", "don't"], c: 0 },
            { q: "Find the synonym for the word 'Fast':", a: ["Slow", "Quick", "Calm"], c: 1 },
            { q: "If it rains tomorrow, I ___ stay at home.", a: ["would", "will", "am"], c: 1 },
            { q: "The keys are ___ the table.", a: ["in", "on", "at"], c: 1 },
            { q: "Identify the adjective in this list:", a: ["Beautiful", "Beauty", "Beautifully"], c: 0 },
            { q: "What is the past tense of 'Eat'?", a: ["Eated", "Ate", "Eaten"], c: 1 },
            { q: "How ___ sugar do you want in your tea?", a: ["many", "much", "few"], c: 1 },
            { q: "This is the ___ movie I have ever seen!", a: ["good", "better", "best"], c: 2 },
            { q: "My brother is afraid ___ spiders.", a: ["of", "with", "at"], c: 0 },
            // Pemantapan
            { q: "If I ___ you, I would take that opportunity.", a: ["was", "am", "were"], c: 2 },
            { q: "Which idiom means 'something very easy'?", a: ["Piece of cake", "Cold shoulder", "Under the weather"], c: 0 },
            { q: "She has lived in this city ___ 2015.", a: ["for", "since", "during"], c: 1 },
            { q: "Hardly ___ had I started eating when the phone rang.", a: ["when", "than", "ever"], c: 0 },
            { q: "Which sentence is grammatically correct?", a: ["He don't like it.", "He doesn't likes it.", "He doesn't like it."], c: 2 },
            { q: "A person who writes books is called an...", a: ["Actor", "Author", "Architect"], c: 1 },
            { q: "By this time next year, I ___ my course.", a: ["will finish", "will have finished", "finished"], c: 1 },
            { q: "The old car ___ by the mechanic yesterday.", a: ["fixed", "was fixed", "is fixed"], c: 1 },
            { q: "Despite ___ very tired, she finished the race.", a: ["she was", "of being", "being"], c: 2 },
            { q: "Which word describes something 'very small'?", a: ["Gigantic", "Minute", "Vast"], c: 1 }
        ];

        let idx = 0; 
        let score = 0;

        // Load Username on Nav
        window.addEventListener('DOMContentLoaded', () => {
            const savedData = JSON.parse(localStorage.getItem('userProfile'));
            if (savedData && savedData.name) {
                document.getElementById('nav-user').innerText = savedData.name;
            }
            loadQuestion();
        });

        function loadQuestion() {
            const item = questions[idx];
            document.getElementById('progress').innerText = `Question ${idx + 1} of ${questions.length}`;
            document.getElementById('question-text').innerText = item.q;
            const container = document.getElementById('options-container');
            container.innerHTML = '';
            document.getElementById('next-btn').style.display = 'none';

            item.a.forEach((text, i) => {
                const b = document.createElement('button');
                b.className = 'quiz-option';
                b.innerText = text;
                b.onclick = () => selectOption(b, i, item.c);
                container.appendChild(b);
            });
        }

        function selectOption(button, selectedIdx, correctIdx) {
            const allOptions = document.querySelectorAll('.quiz-option');
            allOptions.forEach(btn => btn.disabled = true);

            if(selectedIdx === correctIdx) { 
                button.classList.add('correct'); 
                score++; 
            } else { 
                button.classList.add('wrong'); 
                allOptions[correctIdx].classList.add('correct');
            }
            document.getElementById('next-btn').style.display = 'block';
        }

        function handleNext() {
            idx++;
            if(idx < questions.length) {
                loadQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            document.getElementById('quiz-content').style.display = 'none';
            const res = document.getElementById('result-content');
            res.style.display = 'block';
            
            let rank, emoji, desc;
            const percentage = (score / questions.length) * 100;

            if (percentage >= 95) {
                rank = "Master of Basics"; emoji = "👑"; 
                desc = "Flawless! You have completely mastered English fundamentals.";
            } else if (percentage >= 80) {
                rank = "English Pro"; emoji = "🥇"; 
                desc = "Impressive! Your foundation is solid and professional.";
            } else if (percentage >= 60) {
                rank = "Solid Learner"; emoji = "🥈"; 
                desc = "Great job! You have a strong grasp of the basics.";
            } else if (percentage >= 40) {
                rank = "Rising Star"; emoji = "🌱"; 
                desc = "You're getting there! Just a little more practice needed.";
            } else {
                rank = "Beginner Explorer"; emoji = "📚"; 
                desc = "A good start! Review the materials and try again.";
            }

            document.getElementById('rank-emoji').innerText = emoji;
            document.getElementById('rank-title').innerText = rank;
            document.getElementById('final-score').innerText = `Score: ${score} / ${questions.length} (${Math.round(percentage)}%)`;
            document.getElementById('rank-desc').innerText = desc;

            // Save for Dashboard
            localStorage.setItem('score_L1', score);
            localStorage.setItem('userRank', rank);
        }

        function toggleMenu() {
            const navLinks = document.querySelector('.nav-links');
            navLinks.classList.toggle('active');
        }

        function logout() {
            if(confirm("Are you sure you want to log out?")) {
                localStorage.removeItem("sudahLogin");
                window.location.href = "login.html";
            }
        }
    </script>
</body>
</html>
